<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로지스틱 익스체인지 — 선생님 화면</title>
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script src="game-data.js"></script>
<script src="realtime.js"></script>
<style>
  /* 교사 화면: 교실 뒤에서도 읽히게 조금 키움 */
  body { font-size: 17px; }
  .news-card h3 { font-size: 21px; }
  .news-card p { font-size: 16px; }
  .dash-grid { display: grid; grid-template-columns: 1fr 380px; gap: 12px; align-items: start; }
  @media (max-width: 1100px) { .dash-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="topbar">
  <div class="title">📈 로지스틱 익스체인지 <span class="muted">선생님</span></div>
  <span class="chip" id="chipRoom" style="display:none"></span>
  <span class="chip" id="chipRound" style="display:none"></span>
  <span class="round-code" id="roundCode" style="display:none;font-size:20px;padding:2px 12px"></span>
  <div class="spacer"></div>
  <button class="btn btn-sm" id="btnSound">🔊 효과음 켬</button>
  <span class="conn" id="connDot"><span class="dot"></span><span id="connTxt">확인 중</span></span>
</div>

<div class="wrap">

  <!-- ═══ 방 개설 ═══ -->
  <section id="scrSetup" class="panel" style="max-width:520px;margin:40px auto">
    <h2>🎮 새 게임 만들기</h2>
    <label>모둠(투자회사) 수</label>
    <select id="setGroups">
      <option>2</option><option>3</option><option>4</option><option>5</option>
      <option selected>6</option><option>7</option><option>8</option>
    </select>
    <div class="mt">
      <button class="btn btn-primary btn-big" style="width:100%" id="btnCreate">🚀 새 게임 (방 개설)</button>
    </div>
    <p class="muted mt" id="setupMsg"></p>
    <div class="mt hidden" id="resumeBox">
      <button class="btn" style="width:100%" id="btnResume"></button>
    </div>
  </section>

  <!-- ═══ 로비 (모둠 입장 대기) ═══ -->
  <section id="scrLobby" class="hidden">
    <div class="panel center">
      <div class="big-label">방 코드</div>
      <div class="room-code" id="lobbyCode"></div>
      <p style="font-size:20px">태블릿에서 접속 → <b id="lobbyUrl" style="color:var(--accent)"></b></p>
      <img id="lobbyQr" alt="QR" style="border-radius:12px;background:#fff;padding:8px" width="180" height="180">
      <h3 class="mt">입장한 투자회사 <span id="lobbyCount"></span></h3>
      <div class="joined-grid" id="lobbyJoined"></div>
      <div class="mt controls" style="justify-content:center">
        <button class="btn btn-green btn-huge" id="btnStartGame">▶ 게임 시작</button>
      </div>
    </div>
  </section>

  <!-- ═══ 진행 대시보드 ═══ -->
  <section id="scrDash" class="hidden">
    <div class="dash-grid">
      <div>
        <div class="panel">
          <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
            <h2 style="margin:0" id="dashPhaseTitle"></h2>
            <div class="timer hidden" id="dashTimer"></div>
          </div>
          <div id="dashNews" class="mt"></div>
          <div id="dashNote"></div>
        </div>
        <div class="panel">
          <h3>시장 시세</h3>
          <div class="price-board" id="dashPrices"></div>
        </div>
        <div class="panel">
          <div class="controls" id="dashControls"></div>
        </div>
      </div>
      <div>
        <div class="panel">
          <h3>🏆 실시간 리더보드</h3>
          <div id="dashBoard"></div>
        </div>
        <div class="panel hidden" id="manualPanel">
          <h3>✍️ 자산 수동 입력 (오프라인 진행)</h3>
          <p class="muted">모둠이 구두로 보고한 총자산을 입력하면 위 순위에 반영됩니다.</p>
          <div id="manualRows"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ═══ 최종 결과 ═══ -->
  <section id="scrFinal" class="hidden">
    <div class="panel center">
      <h1>🏁 최종 결과</h1>
      <div id="finalPodium"></div>
    </div>
    <div class="panel">
      <h3>📈 라운드별 자산 추이</h3>
      <canvas id="finalChart" width="1100" height="360" style="width:100%;max-width:1100px"></canvas>
    </div>
    <div class="panel" id="finalBest"></div>
    <div class="panel">
      <h3>📋 모둠별 성적표</h3>
      <div id="finalDetail"></div>
    </div>
    <div class="panel center">
      <button class="btn btn-red btn-big" id="btnCloseRoom">🚪 방 종료 (데이터 삭제)</button>
    </div>
  </section>

</div>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const SCREENS = ["scrSetup","scrLobby","scrDash","scrFinal"];
function show(id){ SCREENS.forEach(x => $("#"+x).classList.toggle("hidden", x!==id)); }
function deep(o){ return JSON.parse(JSON.stringify(o)); }

// ─────────────────────────────────────────────
// 교사 상태
// ─────────────────────────────────────────────
const LS_KEY = "lx_teacher_v1";
let T = {
  mode: null,            // "online" | "local"
  room: "",
  groupCount: 6,
  localState: null,      // 로컬 모드일 때의 state
  manualBoard: [],       // 로컬 모드 수동 리더보드 [{name, asset}]
};
let stateCache = null;   // 온라인 state 미러
let groupsCache = {};    // 온라인 groups 미러
let undoSnap = null;     // 되돌리기 1단계
let prevRanks = {};      // 순위 변동 표시용
let online = false;
let sndOn = true;
let timerIv = null;

function saveT(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(T)); }catch(e){} }
function loadT(){ try{ const r = localStorage.getItem(LS_KEY); if(r) T = Object.assign(T, JSON.parse(r)); }catch(e){} }

function st(){ return T.mode === "local" ? T.localState : stateCache; }

function freshState(){
  return { round: 0, phase: "lobby", prices: initialPrices(), timerEnd: 0 };
}

// state 변경 (온·오프 공통 진입점)
async function writeState(patch){
  if(T.mode === "local"){
    Object.assign(T.localState, patch);
    saveT(); renderAll();
  } else {
    await RT.update("rooms/"+T.room+"/state", patch);
  }
}

function snapshot(){
  undoSnap = { state: deep(st()), groups: deep(groupsCache) };
}
async function undo(){
  if(!undoSnap){ alert("되돌릴 단계가 없습니다."); return; }
  const s = undoSnap; undoSnap = null;
  if(T.mode === "local"){
    T.localState = s.state; saveT(); renderAll();
  } else {
    await RT.set("rooms/"+T.room+"/state", s.state);
    await RT.set("rooms/"+T.room+"/groups", s.groups);
  }
  beep(220, .15);
}

// ─────────────────────────────────────────────
// 효과음 (WebAudio)
// ─────────────────────────────────────────────
let audioCtx = null;
function beep(freq, dur, type){
  if(!sndOn) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(.18, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  }catch(e){}
}
function sndNews(){ beep(880,.12,"square"); setTimeout(()=>beep(1175,.2,"square"),140); }
function sndReveal(){ beep(523,.1); setTimeout(()=>beep(659,.1),110); setTimeout(()=>beep(784,.25),220); }
$("#btnSound").addEventListener("click", () => {
  sndOn = !sndOn;
  $("#btnSound").textContent = sndOn ? "🔊 효과음 켬" : "🔇 효과음 끔";
});

// ─────────────────────────────────────────────
// 방 개설
// ─────────────────────────────────────────────
$("#btnCreate").addEventListener("click", async () => {
  T.groupCount = parseInt($("#setGroups").value, 10);
  if(RT.isOnline()){
    $("#setupMsg").textContent = "방을 만드는 중…";
    try{
      RT.cleanupOldRooms(); // 24시간 지난 방 정리 (비동기, 실패 무시)
      const { code } = await RT.createRoom("transport-stock", { groupCount: T.groupCount });
      await RT.set("rooms/"+code+"/state", freshState());
      T.mode = "online"; T.room = code; saveT();
      attachRoom();
    }catch(e){ $("#setupMsg").textContent = "방 개설 실패: " + e.message; }
  } else {
    // 오프라인 진행 모드
    T.mode = "local"; T.room = "----";
    T.localState = freshState();
    T.localState.phase = "preview"; T.localState.round = 1;
    T.manualBoard = Array.from({length: T.groupCount}, (_,i) => ({ name: (i+1)+"모둠", asset: 100 }));
    saveT();
    renderAll();
  }
});

function attachRoom(){
  RT.watch("rooms/"+T.room+"/state", (s) => { stateCache = s; renderAll(); });
  RT.watch("rooms/"+T.room+"/groups", (g) => { groupsCache = g || {}; renderAll(); });
}

$("#btnResume").addEventListener("click", () => {
  if(T.mode === "online" && RT.isOnline()) attachRoom();
  else renderAll();
});

$("#btnCloseRoom").addEventListener("click", async () => {
  if(!confirm("방과 모든 데이터를 삭제할까요? (학생들 성적표는 각 태블릿에 남습니다)")) return;
  if(T.mode === "online") await RT.remove("rooms/"+T.room);
  localStorage.removeItem(LS_KEY);
  location.reload();
});

// ─────────────────────────────────────────────
// 진행 조작
// ─────────────────────────────────────────────
async function startGame(){
  snapshot();
  await writeState({ round: 1, phase: "preview" });
}

async function startRound(){
  snapshot();
  const round = st().round;
  // 모둠 확정 상태 리셋
  if(T.mode === "online"){
    for(const gid of Object.keys(groupsCache)){
      RT.update("rooms/"+T.room+"/groups/"+gid, { confirmed: false });
    }
  }
  sndNews();
  await writeState({ phase: "trading", timerEnd: Date.now() + GAME.roundSeconds*1000 });
}

async function lockTrading(){
  snapshot();
  await writeState({ phase: "locked" });
}

async function reveal(){
  snapshot();
  const s = st();
  const round = s.round;
  const newPrices = applyDeltas(s.prices, ROUNDS[round-1].real.deltas);
  sndReveal();
  await writeState({ phase: "revealed", prices: newPrices });
  // 모둠별 자산 기록 (최종 차트용)
  if(T.mode === "online"){
    for(const gid of Object.keys(groupsCache)){
      const g = groupsCache[gid];
      const asset = calcAsset(g.cash, g.holdings, newPrices);
      RT.update("rooms/"+T.room+"/groups/"+gid+"/history", { [round]: asset });
    }
  }
}

async function nextRound(){
  snapshot();
  prevRanks = currentRanks();
  await writeState({ round: st().round + 1, phase: "preview" });
}

async function finishGame(){
  snapshot();
  await writeState({ phase: "finished" });
}

// ─────────────────────────────────────────────
// 렌더링
// ─────────────────────────────────────────────
function renderAll(){
  const s = st();
  if(!T.mode || !s){ renderSetup(); return; }

  // 상단 칩
  $("#chipRoom").style.display = "";
  $("#chipRoom").innerHTML = T.mode==="local" ? "📴 오프라인 진행" : "방 <b>"+T.room+"</b>";
  if(s.round >= 1){
    $("#chipRound").style.display = "";
    $("#chipRound").innerHTML = "라운드 <b>"+s.round+"</b>/"+GAME.totalRounds;
    $("#roundCode").style.display = "";
    $("#roundCode").textContent = "라운드 코드 R-" + s.round;
  }

  if(s.phase === "lobby"){ renderLobby(); return; }
  if(s.phase === "finished"){ renderFinal(); return; }
  renderDash();
}

function renderSetup(){
  show("scrSetup");
  if(!RT.enabled){
    $("#setupMsg").innerHTML = "⚠️ <b>config.js 없음/서버 연결 불가</b> — [새 게임]을 누르면 <b>오프라인 진행 모드</b>(뉴스 코드)로 시작합니다.";
  }
  if(T.mode){
    $("#resumeBox").classList.remove("hidden");
    $("#btnResume").textContent = "↩ 이전 게임 이어하기 " + (T.mode==="online" ? "(방 "+T.room+")" : "(오프라인 진행)");
  }
}

function renderLobby(){
  show("scrLobby");
  $("#lobbyCode").textContent = T.room;
  const url = location.href.replace(/teacher\.html.*/, "student.html");
  $("#lobbyUrl").textContent = url;
  $("#lobbyQr").src = "https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=" + encodeURIComponent(url);
  const names = Object.values(groupsCache).map(g => g.name);
  $("#lobbyCount").textContent = "(" + names.length + "/" + T.groupCount + ")";
  $("#lobbyJoined").innerHTML = names.map(n => '<div class="joined-card">🏢 '+n+'</div>').join("")
    || '<p class="muted">아직 입장한 모둠이 없습니다…</p>';
}

function renderDash(){
  show("scrDash");
  const s = st();
  renderNewsArea(s);
  renderPrices(s);
  renderControls(s);
  renderBoard(s);
  $("#manualPanel").classList.toggle("hidden", T.mode !== "local");
  if(T.mode === "local") renderManual();
}

function phaseTitle(s){
  switch(s.phase){
    case "preview": return "라운드 " + s.round + " — 준비";
    case "trading": return "🔥 라운드 " + s.round + " — 매매 중!";
    case "locked": return "⏳ 라운드 " + s.round + " — 매매 마감";
    case "revealed": return "🔔 라운드 " + s.round + " — 시장 반응";
  }
  return "";
}

function renderNewsArea(s){
  $("#dashPhaseTitle").textContent = phaseTitle(s);
  const box = $("#dashNews"); const noteBox = $("#dashNote");
  noteBox.innerHTML = "";

  if(s.phase === "preview"){
    box.innerHTML = '<div class="center" style="padding:40px 0"><div style="font-size:52px">📰</div>'+
      '<p class="big-label">[라운드 시작]을 누르면 속보 3개가 동시에 공개됩니다</p>'+
      '<p class="muted">셋 중 시장을 움직이는 뉴스는 하나!</p></div>';
    stopDashTimer();
    return;
  }

  const cards = roundCards(s.round);
  if(s.phase === "trading" || s.phase === "locked"){
    box.innerHTML = '<div class="news-grid">' + cards.map((c,i) =>
      '<div class="news-card"><div class="tag">속보 '+(i+1)+'</div><h3>'+c.title+'</h3><p>'+c.body+'</p></div>'
    ).join("") + '</div>';
    if(s.phase === "trading") startDashTimer(s.timerEnd);
    else stopDashTimer();
  }

  if(s.phase === "revealed"){
    stopDashTimer();
    const R = ROUNDS[s.round-1];
    box.innerHTML = '<div class="news-grid">' + cards.map((c) =>
      '<div class="news-card '+(c.isReal?"real":"dummy")+'">'+
        '<div class="tag">'+(c.isReal?"🔔 시장을 움직인 뉴스":"더미")+'</div><h3>'+c.title+'</h3>'+
        (c.isReal ? '<p>'+c.body+'</p>' : '<div class="noreact">시장 반응 없음 — '+c.whyNo+'</div>')+
      '</div>'
    ).join("") + '</div>';
    noteBox.innerHTML = '<div class="note-card"><div class="h">📖 해설 — 수단의 특징으로 설명하면</div>'+R.real.note+'</div>';
  }
}

function renderPrices(s){
  const el = $("#dashPrices"); el.innerHTML = "";
  const deltas = s.phase === "revealed" ? ROUNDS[s.round-1].real.deltas : null;
  const maxP = Math.max(15, ...STOCK_IDS.map(id => s.prices[id]));
  STOCKS.forEach(stk => {
    const d = deltas ? (deltas[stk.id]||0) : 0;
    const col = document.createElement("div");
    col.className = "price-col " + (d>0?"up":d<0?"down":"flat");
    col.innerHTML =
      '<div class="barbox"><div class="bar" style="height:'+Math.max(4, s.prices[stk.id]/maxP*100)+'%"></div></div>'+
      '<div class="emoji">'+stk.emoji+'</div><div class="nm">'+stk.name+'</div>'+
      '<div class="pr">'+fmtCoin(s.prices[stk.id])+'</div>'+
      '<div class="delta">'+(deltas ? (d===0?"—":fmtPct(d)) : "")+'</div>';
    el.appendChild(col);
  });
}

function renderControls(s){
  const box = $("#dashControls"); box.innerHTML = "";
  const mk = (label, cls, fn, dis) => {
    const b = document.createElement("button");
    b.className = "btn btn-big " + cls; b.textContent = label; b.disabled = !!dis;
    b.addEventListener("click", fn); box.appendChild(b); return b;
  };
  if(s.phase === "preview") mk("📰 라운드 시작 (뉴스 공개 + "+GAME.roundSeconds+"초)", "btn-green", startRound);
  if(s.phase === "trading") mk("⏹ 매매 마감", "btn-amber", lockTrading);
  if(s.phase === "locked") mk("🔔 시장 공개", "btn-primary", reveal);
  if(s.phase === "revealed"){
    if(s.round < GAME.totalRounds) mk("➡ 다음 라운드", "btn-green", nextRound);
    else mk("🏁 최종 결과", "btn-amber", finishGame);
  }
  mk("↩ 되돌리기", "btn-ghost", undo, !undoSnap);
  const close = document.createElement("button");
  close.className = "btn btn-sm btn-ghost"; close.textContent = "방 종료";
  close.addEventListener("click", () => $("#btnCloseRoom").click());
  box.appendChild(close);
}

// ─────────────────────────────────────────────
// 리더보드
// ─────────────────────────────────────────────
function boardEntries(s){
  if(T.mode === "local"){
    return T.manualBoard.map((m,i) => ({ id:"m"+i, name:m.name, asset:Number(m.asset)||0, confirmed:null, holdings:null }));
  }
  return Object.entries(groupsCache).map(([id,g]) => ({
    id, name: g.name,
    asset: calcAsset(g.cash, g.holdings, s.prices),
    confirmed: !!g.confirmed,
    holdings: g.holdings || {},
  }));
}
function currentRanks(){
  const es = boardEntries(st()).sort((a,b) => b.asset - a.asset);
  const r = {}; es.forEach((e,i) => r[e.id] = i+1); return r;
}
function renderBoard(s){
  const es = boardEntries(s).sort((a,b) => b.asset - a.asset);
  const box = $("#dashBoard");
  if(!es.length){ box.innerHTML = '<p class="muted">입장한 모둠이 없습니다.</p>'; return; }
  box.innerHTML = "";
  es.forEach((e, i) => {
    const row = document.createElement("div");
    row.className = "lb-row" + (i===0 ? " first" : "");
    let move = "";
    if(prevRanks[e.id]){
      const d = prevRanks[e.id] - (i+1);
      if(d > 0) move = '<span class="move up">▲'+d+'</span>';
      else if(d < 0) move = '<span class="move down">▼'+(-d)+'</span>';
      else move = '<span class="move">—</span>';
    } else move = '<span class="move"></span>';
    const hold = e.holdings ? STOCK_IDS.filter(id => e.holdings[id]>0)
      .map(id => STOCK_BY_ID[id].emoji + e.holdings[id]).join(" ") : "";
    let status = "";
    if(s.phase === "trading" && e.confirmed !== null)
      status = e.confirmed ? '<span class="ok">✔</span>' : '<span class="wait">입력 중…</span>';
    row.innerHTML =
      '<div class="rank">'+(i+1)+'</div><div class="name">'+e.name+
      (hold ? ' <span class="hold">'+hold+'</span>' : '')+'</div>'+
      status + move +
      '<div class="asset">'+fmtCoin(e.asset)+'c</div>';
    box.appendChild(row);
  });
}

function renderManual(){
  const box = $("#manualRows");
  if(box.childElementCount === T.manualBoard.length) return; // 입력 중 리렌더 방지
  box.innerHTML = "";
  T.manualBoard.forEach((m, i) => {
    const row = document.createElement("div");
    row.style.cssText = "display:flex;gap:8px;margin-bottom:6px";
    row.innerHTML = '<input type="text" value="'+m.name+'" data-i="'+i+'" data-k="name">'+
      '<input type="number" value="'+m.asset+'" data-i="'+i+'" data-k="asset" style="max-width:110px">';
    box.appendChild(row);
  });
  box.querySelectorAll("input").forEach(inp => {
    inp.addEventListener("change", () => {
      const i = +inp.dataset.i;
      if(inp.dataset.k === "name") T.manualBoard[i].name = inp.value;
      else T.manualBoard[i].asset = parseFloat(inp.value)||0;
      saveT(); renderBoard(st());
    });
  });
}

// ─────────────────────────────────────────────
// 타이머 (매매 창 종료 시 자동 마감)
// ─────────────────────────────────────────────
function startDashTimer(endMs){
  stopDashTimer();
  const el = $("#dashTimer");
  el.classList.remove("hidden");
  const tick = () => {
    const sec = Math.max(0, Math.ceil((endMs - Date.now())/1000));
    el.textContent = sec;
    el.className = "timer" + (sec<=10 ? " danger" : sec<=20 ? " warn" : "");
    if(sec <= 0){
      stopDashTimer();
      const s = st();
      if(s && s.phase === "trading") lockTrading();
    }
  };
  tick();
  timerIv = setInterval(tick, 250);
}
function stopDashTimer(){
  if(timerIv){ clearInterval(timerIv); timerIv = null; }
  $("#dashTimer").classList.add("hidden");
}

// ─────────────────────────────────────────────
// 최종 결과
// ─────────────────────────────────────────────
const CHART_COLORS = ["#f5a524","#16c784","#3b82f6","#ea3943","#a855f7","#22d3ee","#f472b6","#84cc16"];

function renderFinal(){
  show("scrFinal");
  stopDashTimer();
  const s = st();
  const es = boardEntries(s).sort((a,b) => b.asset - a.asset);

  // 시상대
  $("#finalPodium").innerHTML = es.map((e,i) => {
    const medal = i===0 ? "🏆" : i===1 ? "🥈" : i===2 ? "🥉" : (i+1)+"위";
    return '<div class="lb-row'+(i===0?" first":"")+'"><div class="rank" style="font-size:28px">'+medal+'</div>'+
      '<div class="name" style="font-size:'+(i===0?26:20)+'px">'+e.name+'</div>'+
      '<div class="asset" style="font-size:'+(i===0?28:20)+'px">'+fmtCoin(e.asset)+'c</div></div>';
  }).join("");

  if(T.mode === "local"){
    $("#finalChart").parentElement.classList.add("hidden");
    $("#finalBest").classList.add("hidden");
    $("#finalDetail").innerHTML = '<p class="muted">오프라인 진행 모드 — 라운드별 기록은 각 모둠 태블릿의 성적표에 있습니다.</p>';
    return;
  }

  drawChart(es);
  renderBest();
  renderDetail();
}

function drawChart(es){
  const cv = $("#finalChart"), ctx = cv.getContext("2d");
  ctx.clearRect(0,0,cv.width,cv.height);
  const gids = Object.keys(groupsCache);
  let maxA = 150, minA = 50;
  gids.forEach(gid => {
    const h = groupsCache[gid].history || {};
    Object.values(h).forEach(v => { maxA = Math.max(maxA, v); minA = Math.min(minA, v); });
  });
  const padL = 60, padR = 20, padT = 20, padB = 40;
  const W = cv.width - padL - padR, H = cv.height - padT - padB;
  const x = (r) => padL + (r/GAME.totalRounds)*W;              // r=0 → 시작
  const y = (a) => padT + (1 - (a-minA)/(maxA-minA||1))*H;

  // 축
  ctx.strokeStyle = "#24304a"; ctx.fillStyle = "#8b98af"; ctx.font = "13px sans-serif";
  ctx.beginPath();
  for(let g=0; g<=4; g++){
    const a = minA + (maxA-minA)*g/4;
    ctx.moveTo(padL, y(a)); ctx.lineTo(cv.width-padR, y(a));
    ctx.fillText(Math.round(a)+"c", 8, y(a)+4);
  }
  ctx.stroke();
  for(let r=0; r<=GAME.totalRounds; r++){
    ctx.fillText(r===0?"시작":"R"+r, x(r)-10, cv.height-14);
  }

  // 선
  gids.forEach((gid, gi) => {
    const g = groupsCache[gid];
    const h = g.history || {};
    ctx.strokeStyle = CHART_COLORS[gi % CHART_COLORS.length];
    ctx.lineWidth = 3; ctx.beginPath();
    ctx.moveTo(x(0), y(GAME.startCash));
    let last = GAME.startCash;
    for(let r=1; r<=GAME.totalRounds; r++){
      if(h[r] !== undefined) last = h[r];
      ctx.lineTo(x(r), y(last));
    }
    ctx.stroke();
    ctx.fillStyle = ctx.strokeStyle;
    ctx.font = "bold 14px sans-serif";
    ctx.fillText(g.name, x(GAME.totalRounds)-ctx.measureText(g.name).width, y(last)-8);
  });
}

function renderBest(){
  let best = null;
  for(const gid of Object.keys(groupsCache)){
    const g = groupsCache[gid], h = g.history || {};
    for(let r=1; r<=GAME.totalRounds; r++){
      if(h[r] === undefined) continue;
      const prev = r===1 ? GAME.startCash : (h[r-1] !== undefined ? h[r-1] : GAME.startCash);
      const gain = r1(h[r] - prev);
      if(!best || gain > best.gain){
        const tr = g.trades && g.trades[r];
        best = { name: g.name, round: r, gain, reason: tr ? tr.reason : "" };
      }
    }
  }
  const el = $("#finalBest");
  if(!best || best.gain <= 0){ el.classList.add("hidden"); return; }
  el.classList.remove("hidden");
  el.innerHTML = '<h3>💥 최고의 한 방</h3>'+
    '<p style="font-size:20px"><b>'+best.name+'</b> — 라운드 '+best.round+'에서 <b style="color:var(--green)">+'+fmtCoin(best.gain)+'코인</b></p>'+
    (best.reason ? '<p class="muted">그때의 이유: "'+best.reason+'"</p>' : "");
}

function renderDetail(){
  const box = $("#finalDetail"); box.innerHTML = "";
  Object.values(groupsCache).forEach(g => {
    const det = document.createElement("details");
    det.style.marginBottom = "8px";
    let rows = "";
    for(let r=1; r<=GAME.totalRounds; r++){
      const tr = g.trades && g.trades[r];
      if(!tr){ rows += '<div class="r-line report-item">R'+r+' — 기록 없음</div>'; continue; }
      const pickOk = tr.pick === "real";
      const trades = tr.trades && Object.keys(tr.trades).length
        ? Object.entries(tr.trades).map(([id,n]) => STOCK_BY_ID[id].emoji+(n>0?"+":"")+n).join(" ") : "관망";
      rows += '<div class="report-item '+(pickOk?"ok":"no")+'">'+
        '<div class="r-title">R'+r+' '+(pickOk?"✔":"✘")+' · '+trades+
        (g.history && g.history[r] !== undefined ? ' · 자산 '+fmtCoin(g.history[r])+'c' : "")+'</div>'+
        '<div class="r-line">"'+(tr.reason||"")+'"</div></div>';
    }
    det.innerHTML = '<summary style="cursor:pointer;font-weight:800;font-size:18px;padding:8px">🏢 '+g.name+'</summary>'+rows;
    box.appendChild(det);
  });
}
